# MLP-bottleneck control (Ablation B): KAN block replaced by a
# parameter-matched Tokenized MLP (Linear -> GELU -> Linear, 2 layers,
# hidden_mult=5). hidden_mult is HARDCODED to 5 inside KAN_UNet_MLP /
# MLPTokenBlock, and the subclass __init__ does NOT accept use_tanh or
# bottleneck_type -- so do not set those here. Identical to default.yaml
# except model.name -> kan_unet_mlp.
experiment:
  name: mlp_bottleneck
  save_dir: ./runs/mlp_bottleneck
  seed: 42

task: multiclass
num_classes: 4
class_names: [background, LV_endocardium, LV_myocardium, left_atrium]
foreground_classes: [1, 2, 3]

data:
  root: ./datasets/CAMUS_NIFTI
  file_ext: .nii.gz
  split_seed: 42
  image_size: 256
  target_label: 1
  val_ratio: 0.15
  test_ratio: 0.15
  views: ["2CH", "4CH"]

model:
  name: kan_unet_mlp
  params:
    in_channels: 3
    base_channels: 32
    kan_num_layers: 2
    kan_grid_size: 5
    kan_spline_order: 3

train:
  batch_size: 8
  num_workers: 0
  num_epochs: 100
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4
  scheduler:
    name: cosine
    T_max: 100
    eta_min: 1.0e-6
  augment: true